name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.15.0
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Reproduce catalog from pinned source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/yuhonas/free-exercise-db.git "$RUNNER_TEMP/free-exercise-db"
          git -C "$RUNNER_TEMP/free-exercise-db" checkout a859101d633a01c4a1a920d6a8ce41dabba0705f
          npm run catalog:check -- --source "$RUNNER_TEMP/free-exercise-db"
      - run: npm run test:e2e -- --reporter=line,html
        env:
          DEBUG: pw:browser
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  diagnose-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/quality/diagnose-webkit.mjs
        env:
          DEBUG: pw:browser
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-webkit-diagnostics
          path: test-results/webkit-diagnostic-*.png
          if-no-files-found: ignore
          retention-days: 7
